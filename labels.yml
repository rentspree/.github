# labels.yml — Canonical label taxonomy for RentSpree GitHub repos
# Sync to repos using github-label-sync or similar tooling.

# Priority
- name: "priority/critical"
  color: "b60205"
  description: "Immediate attention required"
- name: "priority/high"
  color: "d93f0b"
  description: "Should be addressed soon"
- name: "priority/medium"
  color: "fbca04"
  description: "Normal priority"
- name: "priority/low"
  color: "0e8a16"
  description: "Address when convenient"

# Type
- name: "type/bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "type/feature"
  color: "a2eeef"
  description: "New feature or enhancement"
- name: "type/tech-debt"
  color: "d4c5f9"
  description: "Technical debt to address"
- name: "type/operational"
  color: "f9d0c4"
  description: "Operational or infrastructure issue"

# Area
- name: "area/frontend"
  color: "1d76db"
  description: "Frontend application"
- name: "area/backend"
  color: "5319e7"
  description: "Backend services and APIs"
- name: "area/infrastructure"
  color: "006b75"
  description: "Infrastructure and DevOps"
- name: "area/data"
  color: "0075ca"
  description: "Data pipelines and storage"
- name: "area/integrations"
  color: "e4e669"
  description: "Third-party integrations"

# Severity
- name: "severity/critical"
  color: "b60205"
  description: "Service outage or data loss"
- name: "severity/high"
  color: "d93f0b"
  description: "Major degradation affecting users"
- name: "severity/medium"
  color: "fbca04"
  description: "Partial degradation, workaround available"
- name: "severity/low"
  color: "0e8a16"
  description: "Minor issue, no user impact"

# Status
- name: "status/triage"
  color: "ededed"
  description: "Awaiting triage"
- name: "status/accepted"
  color: "c5def5"
  description: "Triaged and accepted"
- name: "status/in-progress"
  color: "0075ca"
  description: "Work in progress"
- name: "status/blocked"
  color: "b60205"
  description: "Blocked by dependency or decision"
- name: "status/wont-fix"
  color: "ffffff"
  description: "Will not be addressed"

# Bot
- name: "bot/md-drift"
  color: "c2e0c6"
  description: "Created by md-drift workflow"
- name: "bot/summary"
  color: "c2e0c6"
  description: "Automated workflow summary"
- name: "bot/md-first-gen"
  color: "c2e0c6"
  description: "Created by md-first-gen workflow"

# AI
- name: "ai-candidate"
  color: "7057ff"
  description: "Suitable for AI agent delegation"
- name: "ai-assigned"
  color: "3e4b9e"
  description: "Assigned to an AI agent"
- name: "claude-code-assisted"
  color: "d4c5f9"
  description: "PR created or assisted by Claude Code"
