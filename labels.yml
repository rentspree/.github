# labels.yml — Canonical label taxonomy for RentSpree GitHub repos
#
# Design decisions:
#   - Prefixed (key/value) for multi-value categories where grouping helps filtering
#   - Simple names for standalone type and AI labels to reuse existing GitHub defaults
#   - Release/semver labels (patch, minor, major, release, want-to-release) are
#     repo-local for library repos and excluded from this org-wide taxonomy
#   - ADR labels (adr:proposed, etc.) are repo-local to rentspree-architecture
#
# Sync: A GitHub Actions workflow in this repo propagates these labels to all
# non-archived repos. The sync is additive — it creates/updates labels listed here
# but does NOT delete repo-local labels not in this file.

# Type (simple names — reuses GitHub defaults where possible)
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or enhancement"
- name: "tech-debt"
  color: "d4c5f9"
  description: "Technical debt to address"
- name: "operational"
  color: "f9d0c4"
  description: "Operational or infrastructure issue"

