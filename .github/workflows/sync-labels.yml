name: Sync Labels

on:
  push:
    branches: [main]
    paths: [labels.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CICD_APP_ID }}
          private-key: ${{ secrets.CICD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get non-archived repos
        id: repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh repo list ${{ github.repository_owner }} \
            --limit 200 \
            --no-archived \
            --json name \
            --jq '.[].name' > repos.txt
          echo "count=$(wc -l < repos.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Sync labels to all repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OWNER="${{ github.repository_owner }}"
          FAILED=0
          SYNCED=0

          # Parse labels.yml into arrays (name, color, description)
          parse_labels() {
            local name="" color="" desc=""
            while IFS= read -r line; do
              case "$line" in
                "- name: "*)
                  name="${line#*: }"
                  name="${name%\"}"
                  name="${name#\"}"
                  ;;
                "  color: "*)
                  color="${line#*: }"
                  color="${color%\"}"
                  color="${color#\"}"
                  ;;
                "  description: "*)
                  desc="${line#*: }"
                  desc="${desc%\"}"
                  desc="${desc#\"}"
                  echo "${name}|${color}|${desc}"
                  name="" color="" desc=""
                  ;;
              esac
            done < labels.yml
          }

          LABELS=$(parse_labels)

          while IFS= read -r REPO; do
            # Skip the .github repo itself
            if [ "$REPO" = ".github" ]; then
              continue
            fi

            echo "::group::Syncing $OWNER/$REPO"

            REPO_FAILED=false
            while IFS='|' read -r NAME COLOR DESC; do
              if ! gh label create "$NAME" \
                --repo "$OWNER/$REPO" \
                --color "$COLOR" \
                --description "$DESC" \
                --force 2>&1; then
                echo "::warning::Failed to sync label '$NAME' to $OWNER/$REPO"
                REPO_FAILED=true
              fi
            done <<< "$LABELS"

            if [ "$REPO_FAILED" = true ]; then
              echo "::warning::Some labels failed to sync to $OWNER/$REPO"
              FAILED=$((FAILED + 1))
            else
              SYNCED=$((SYNCED + 1))
            fi

            echo "::endgroup::"

            # Rate limit: small delay between repos
            sleep 0.5
          done < repos.txt

          echo "## Label Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Synced: $SYNCED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed: $FAILED" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED repos failed to sync"
          fi
