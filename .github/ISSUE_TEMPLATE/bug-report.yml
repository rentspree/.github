name: "Bug Report"
description: "Report a bug or unexpected behavior"
labels: ["type/bug", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below so we can investigate.

  - type: input
    id: service
    attributes:
      label: "Affected Service / Repository"
      description: "Which service or repo does this affect?"
      placeholder: "e.g., rentspree-web, rentspree-api, rentspree-agent"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: "Steps to Reproduce"
      description: "Provide step-by-step instructions to reproduce the behavior."
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened?"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Any relevant environment details (browser, OS, API version, etc.)."
      placeholder: "Browser: Chrome 120, OS: macOS 14, API version: v2"
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "How urgent is this issue?"
      options:
        - "critical — service down or data loss"
        - "high — major feature broken"
        - "medium — degraded experience"
        - "low — minor inconvenience"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Which area of the system is affected?"
      options:
        - frontend
        - backend
        - infrastructure
        - data
        - integrations
    validations:
      required: true

  - type: dropdown
    id: ai-candidate
    attributes:
      label: "AI Delegation Candidate?"
      description: "Could an AI agent help resolve this with clear acceptance criteria?"
      options:
        - "yes — well-scoped, clear fix"
        - "maybe — needs refinement"
        - "no — requires human judgment"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      description: "Screenshots, logs, links, or anything else that helps."
    validations:
      required: false
